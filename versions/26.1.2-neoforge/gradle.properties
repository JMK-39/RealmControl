loader=neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neoforge_version=26.1.2.112
neoforge_version_range=[26.1.2.0,)
loader_version_range=[1,)
# Java the game runs on: bytecode level and usable language/API
java_version=25
# Resource pack format 84, data pack format 101; 26.1 packs declare a format range.
pack_min_format=84
pack_max_format=101
# Third-party mods compiled against. KubeJS 26.1 no longer needs Architectury; Explorer's Compass is the official
# release, the edited fork has no 26.1 build. KubeJS stays compile-only: its 26.1 build injects into the
# synchronous WorldLoader.load that 26.1.2 replaced, so it cannot start here.
mod_dependencies=maven.modrinth:jade:5jKeKXwB, compileOnly:maven.modrinth:kubejs:FzLyIIBB, compileOnly:maven.modrinth:rhino:SqkDvOLG, maven.modrinth:better-advanced-tooltips:dYc3PUcQ, maven.modrinth:explorers-compass:OuPMcvp4, maven.modrinth:natures-compass:FKGBa8Rq
# Explorer's Compass 26.1 teleports through the connection, so there is no teleportTo call to authorize.
unavailable_mixins=ExplorersCompassMixins$EnhancedLogic
